server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(?:html|css|js)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    location ~* \.(?:png|jpg|jpeg|gif|webp|mp3|wav|ogg)$ {
        expires 1h;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
