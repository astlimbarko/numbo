server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    etag on;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    # El HTML se revalida para descubrir inmediatamente las nuevas versiones.


    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # CSS y JavaScript llevan versión en su URL y pueden conservarse localmente.
    location ~* \.(?:css|js)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location ~* \.(?:png|jpg|jpeg|gif|webp|mp3|wav|ogg)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
